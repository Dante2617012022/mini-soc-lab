name: Lab validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Validate Bash syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Run ShellCheck
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Validate baseline CLI
        run: |
          bash scripts/endpoint/collect-baseline.sh --help >/dev/null

      - name: Reject private-key material
        shell: bash
        run: |
          if git grep -I -n -E -- '-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----'; then
            echo "Private-key material detected in tracked files." >&2
            exit 1
          fi

      - name: Reject raw evidence formats
        shell: bash
        run: |
          tracked="$(git ls-files)"
          if grep -E '(^|/)(evidence/(private|raw)/|.*\.(pcap|pcapng|cap|log)$)' <<<"$tracked"; then
            echo "Raw/private evidence must not be tracked." >&2
            exit 1
          fi
