name: Lab validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck openssh-server

      - name: Validate Bash syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Run ShellCheck
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Validate script CLIs
        run: |
          bash scripts/endpoint/collect-baseline.sh --help >/dev/null
          bash scripts/endpoint/apply-base-hardening.sh --help >/dev/null
          bash scripts/endpoint/collect-telemetry-sample.sh --help >/dev/null
          bash scripts/endpoint/check-wazuh-agent-readiness.sh --help >/dev/null
          bash scripts/management/collect-baseline.sh --help >/dev/null

      - name: Validate endpoint SSH hardening
        run: |
          bash scripts/endpoint/apply-base-hardening.sh --check
          grep -Fxq 'PermitRootLogin no' config/endpoint/sshd_config.d/60-mini-soc-hardening.conf
          grep -Fxq 'PasswordAuthentication yes' config/endpoint/sshd_config.d/60-mini-soc-hardening.conf
          grep -Fxq 'MaxAuthTries 3' config/endpoint/sshd_config.d/60-mini-soc-hardening.conf
          grep -Fxq 'X11Forwarding no' config/endpoint/sshd_config.d/60-mini-soc-hardening.conf
          grep -Fxq 'AllowAgentForwarding no' config/endpoint/sshd_config.d/60-mini-soc-hardening.conf
          grep -Fxq 'AllowTcpForwarding no' config/endpoint/sshd_config.d/60-mini-soc-hardening.conf

      - name: Validate journald policy
        run: |
          grep -Fxq 'Storage=persistent' config/endpoint/journald.conf.d/60-mini-soc.conf
          grep -Fxq 'SystemMaxUse=256M' config/endpoint/journald.conf.d/60-mini-soc.conf

      - name: Reject private-key material
        shell: bash
        run: |
          if git grep -I -n -E -- '-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----'; then
            echo "Private-key material detected in tracked files." >&2
            exit 1
          fi

      - name: Reject raw evidence formats
        shell: bash
        run: |
          tracked="$(git ls-files)"
          if grep -E '(^|/)(evidence/(private|raw)/|.*\.(pcap|pcapng|cap|log)$)' <<<"$tracked"; then
            echo "Raw/private evidence must not be tracked." >&2
            exit 1
          fi
