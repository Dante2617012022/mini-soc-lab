# CHG-003 — SOC-ENDPOINT-01 SSH hardening
#
# The VM is administered through a localhost-only VirtualBox NAT forward.
# Password authentication remains enabled intentionally for the controlled
# password-guessing detection use case until a separate key-auth change is
# validated.

PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
MaxAuthTries 3
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
LogLevel INFO
